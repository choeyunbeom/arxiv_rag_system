[project]
name = "arxiv-rag-system"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    # API
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    
    # RAG
    "chromadb>=0.5.0",
    "rank-bm25>=0.2.2",
    "sentence-transformers>=3.0.0",
    "umap-learn>=0.5.6",
    
    # Data collection / processing
    "arxiv>=2.1.0",
    "pymupdf>=1.24.0",
    "pymupdf4llm>=0.0.5",
    
    # UI
    "streamlit>=1.38.0",
    "httpx>=0.27.0",
    "plotly>=5.24.0",
    "streamlit-plotly-events>=0.0.6",
    
    # Fine-tuning
    "transformers>=4.44.0",
    "peft>=0.12.0",
    "bitsandbytes>=0.43.0",
    "datasets>=2.20.0",
    "trl>=0.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4.0",
]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]
"src/ingestion/indexer.py" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]